name: Publish Docker images

on:
  workflow_call:
    inputs:
      context:
        required: true
        type: string
      image:
        required: true
        type: string
      dockerfile:
        description: Dockerfile path, relative to the context.
        required: false
        type: string
        default: Dockerfile
      watch:
        description: Space-separated paths whose changes trigger a build (default the context).
        required: false
        type: string
        default: ''
      push:
        description: Push the built image. Set to false to only check that it builds.
        required: false
        type: boolean
        default: true
      rebuild_all:
        description: Build even when the published image already has this content.
        required: false
        type: boolean
        default: false

# least privilege for the workflow token (the caller's permissions apply too)
permissions:
  contents: read

jobs:
  check_diff:
    name: Check if any file has changed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      status: ${{ steps.changed-files.outputs.status }}
    steps:
      - uses: actions/checkout@v7
        with:
            # Full history: the diff below needs the PR base branch or the
            # commit the published image was built from.
            fetch-depth: 0

      # The reference is the image on Docker Hub itself: the commit in its
      # org.opencontainers.image.revision label (docker/metadata-action sets
      # it). "The last successful run of this workflow" was not: a check-only
      # run (Push images unchecked) counts as successful and pushes nothing,
      # and on a manual run github.event.after, the other end of the diff, is
      # empty, so every manual publish rebuilt all four images.
      - name: Get changed files
        id: changed-files
        env:
          IMAGE: ${{ inputs.image }}
          # the tag the build pushes (type=ref,event=branch: "/" becomes "-")
          TAG: ${{ github.ref_name }}
          REF: ${{ github.ref }}
        run: |
            # Fail loudly if git cannot compute the diff: an unreadable commit
            # used to make this silently report "same" and skip the build.
            set -euo pipefail
            # paths that decide whether this image is rebuilt (the server and
            # executor build from services/ but only care about their own
            # directory and the shared package)
            watch="${{ inputs.watch }}"
            [ -z "$watch" ] && watch="${{ inputs.context }}"
            if [ "${{ github.event_name }}" = "pull_request" ]; then
                # `build-images` label: build only if the PR touches this image's context
                # shellcheck disable=SC2086  # $watch is a list of paths
                changed_files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- $watch)
                [ -z "${changed_files}" ] && echo "status=same" >> "$GITHUB_OUTPUT" || echo "status=changed" >> "$GITHUB_OUTPUT"
                exit 0
            fi
            if [ "${{ inputs.rebuild_all }}" = "true" ] || [[ "$REF" == refs/tags/* ]]; then
                echo "status=changed" >> "$GITHUB_OUTPUT"
                exit 0
            fi
            # no image yet, or not readable: build rather than silently skip
            published=$(docker buildx imagetools inspect "${IMAGE}:${TAG//\//-}" --format '{{ json .Image }}' 2>/dev/null \
                | jq -r '(."linux/amd64" // .).config.Labels["org.opencontainers.image.revision"] // empty' || true)
            echo "Published ${IMAGE}:${TAG//\//-} was built from '${published}'"
            if [ -z "${published}" ] || ! git cat-file -e "${published}^{commit}" 2>/dev/null; then
                echo "status=changed" >> "$GITHUB_OUTPUT"
                exit 0
            fi
            # shellcheck disable=SC2086
            changed_files=$(git diff --name-only "${published}" "${{ github.sha }}" -- $watch)
            echo "Changed since then: ${changed_files:-nothing}"
            [ -z "${changed_files}" ] && echo "status=same" >> "$GITHUB_OUTPUT" || echo "status=changed" >> "$GITHUB_OUTPUT"

  push_images_to_dockerhub:
    name: Publish docker image
    runs-on: ubuntu-latest
    # a hung QEMU build would otherwise run to the 6 h default and be billed;
    # the executor (the slowest image, multi-arch under QEMU) takes about 15 min
    timeout-minutes: 45
    needs: check_diff
    if: needs.check_diff.outputs.status == 'changed' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout github repo
        uses: actions/checkout@v7

      # https://github.com/docker/metadata-action#semver
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ inputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Log in to Docker Hub
        id: login
        if: inputs.push
        uses: docker/login-action@v4
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The executor image (python + texlive + tensorflow, built for amd64 and
      # arm64 under QEMU) fills the ~20 GB free on a hosted runner and the job
      # dies with "No space left on device". Drop the preinstalled toolchains
      # we never use (~25 GB) before buildx starts writing layers.
      - name: Free disk space on the runner
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/local/share/powershell /usr/lib/jvm /usr/local/.ghcup
          sudo docker image prune --all --force
          df -h / | tail -1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build container
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          # Push only when asked to and the login succeeded. A skipped login
          # never pushes.
          push: ${{ inputs.push && steps.login.outcome == 'success' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache stored in the registry next to the image. mode=max
          # exports every intermediate layer (apt, pip, npm), so this job and a
          # local `docker compose build` (cache_from in docker-compose.yml)
          # download the dependency layers instead of rebuilding them. The
          # cache is only written when the image itself is pushed.
          cache-from: type=registry,ref=${{ inputs.image }}:buildcache
          cache-to: ${{ (inputs.push && steps.login.outcome == 'success') && format('type=registry,ref={0}:buildcache,mode=max', inputs.image) || '' }}
