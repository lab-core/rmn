name: Publish Docker images

on:
  workflow_call:
    inputs:
      context:
        required: true
        type: string
      image:
        required: true
        type: string
      push:
        description: Push the built image. Set to false to only check the build.
        required: false
        type: boolean
        default: true

jobs:
  check_diff:
    name: Check if any file has changed
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.changed-files.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with:
            # Full history: the diff below needs the PR base branch and, on
            # push, the last successfully published commit.
            fetch-depth: 0

      - name: Get last successful commit
        id: last-successful-commit
        continue-on-error: true
        uses: tylermilner/last-successful-commit-hash-action@v1
        with:
          github-token: ${{ github.token }}
          workflow-id: docker-publish-all.yml
          branch: main

      - name: Get changed files
        id: changed-files
        run: |
            # Fail loudly if git cannot compute the diff: an unreadable commit
            # used to make this silently report "same" and skip the build.
            set -euo pipefail
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                # manual publish: build/push every image regardless of diff
                echo "status=changed" >> $GITHUB_OUTPUT
            elif ${{ github.event_name == 'pull_request' }}; then
                # PR check: build if the PR touches this image's context
                changed_files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- "${{ inputs.context }}")
                [ -z "${changed_files}" ] && echo "status=same" >> "$GITHUB_OUTPUT" || echo "status=changed" >> "$GITHUB_OUTPUT"
            else
                last_commit="${{ steps.last-successful-commit.outputs.commit-hash }}"
                if [ -z "${last_commit}" ]; then
                    # No previous successful publish found (first run or API
                    # error): build everything rather than silently skipping.
                    echo "status=changed" >> "$GITHUB_OUTPUT"
                else
                    changed_files=$(git diff --name-only "${last_commit}" "${{ github.event.after }}" -- "${{ inputs.context }}")
                    [ -z "${changed_files}" ] && echo "status=same" >> "$GITHUB_OUTPUT" || echo "status=changed" >> "$GITHUB_OUTPUT"
                fi
            fi

  push_images_to_dockerhub:
    name: Publish docker image
    runs-on: ubuntu-latest
    needs: check_diff
    if: needs.check_diff.outputs.status == 'changed' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout github repo
        uses: actions/checkout@v4

      # https://github.com/docker/metadata-action#semver
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Log in to Docker Hub
        id: login
        if: inputs.push && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The executor image (python + texlive + tensorflow, built for amd64 and
      # arm64 under QEMU) fills the ~20 GB free on a hosted runner and the job
      # dies with "No space left on device". Drop the preinstalled toolchains
      # we never use (~25 GB) before buildx starts writing layers.
      - name: Free disk space on the runner
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/local/share/powershell /usr/lib/jvm /usr/local/.ghcup
          sudo docker image prune --all --force
          df -h / | tail -1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context }}
          # Push only when asked to, the login succeeded and this is not a PR
          # check. A skipped login never pushes.
          push: ${{ inputs.push && steps.login.outcome == 'success' && github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
