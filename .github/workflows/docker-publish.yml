name: Publish Docker images

on:
  workflow_call:
    inputs:
      context:
        required: true
        type: string
      image:
        required: true
        type: string

jobs:
  check_diff:
    name: Check if any file has changed
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.changed-files.outputs.status }}
    steps:
      - uses: actions/checkout@v3
        with:
            fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}

      - name: Get changed files
        id: changed-files
        run: |
            if ${{ github.event_name == 'pull_request' }}; then
                changed_files=$(git diff --name-only -r HEAD^1 HEAD ${{ inputs.context }} | xargs)
            else
                changed_files=$(git diff --name-only ${{ github.event.before }} ${{ github.event.after }} ${{ inputs.context }} | xargs)
            fi
            if [ -z "${changed_files}" ]; then
                echo "status=same" >> $GITHUB_OUTPUT
            else
                echo "status=changed" >> $GITHUB_OUTPUT
            fi

  push_images_to_dockerhub:
    name: Publish docker image
    runs-on: ubuntu-latest
    needs: check_diff
    if: needs.check_diff.outputs.status == 'changed'
    steps:
      - name: Checkout github repo
        uses: actions/checkout@v2

      # https://github.com/docker/metadata-action#semver
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Log in to Docker Hub
        id: login
        uses: docker/login-action@v3
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context }}
          # push if has been able to login or not a pull request
          push: ${{ steps.login.outcome == 'success' && github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
