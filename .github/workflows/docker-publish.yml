name: Publish Docker images

on:
  workflow_call:
    inputs:
      context:
        required: true
        type: string
      image:
        required: true
        type: string

jobs:
  check_diff:
    name: Check if any file has changed
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.changed-files.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with:
            fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}

      - name: Get last successful commit
        id: last-successful-commit
        continue-on-error: true
        uses: tylermilner/last-successful-commit-hash-action@v1
        with:
          github-token: ${{ github.token }}
          workflow-id: docker-publish-all.yml
          branch: main

      - name: Get changed files
        id: changed-files
        run: |
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                # manual publish: build/push every image regardless of diff
                echo "status=changed" >> $GITHUB_OUTPUT
            elif ${{ github.event_name == 'pull_request' }}; then
                changed_files=$(git diff --name-only ${{ steps.last-successful-commit.outputs.commit-hash }} HEAD ${{ inputs.context }} | xargs)
                [ -z "${changed_files}" ] && echo "status=same" >> $GITHUB_OUTPUT || echo "status=changed" >> $GITHUB_OUTPUT
            else
                changed_files=$(git diff --name-only ${{ steps.last-successful-commit.outputs.commit-hash }} ${{ github.event.after }} ${{ inputs.context }} | xargs)
                [ -z "${changed_files}" ] && echo "status=same" >> $GITHUB_OUTPUT || echo "status=changed" >> $GITHUB_OUTPUT
            fi

  push_images_to_dockerhub:
    name: Publish docker image
    runs-on: ubuntu-latest
    needs: check_diff
    if: needs.check_diff.outputs.status == 'changed' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout github repo
        uses: actions/checkout@v4

      # https://github.com/docker/metadata-action#semver
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Log in to Docker Hub
        id: login
        uses: docker/login-action@v3
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The executor image (python + texlive + tensorflow, built for amd64 and
      # arm64 under QEMU) fills the ~20 GB free on a hosted runner and the job
      # dies with "No space left on device". Drop the preinstalled toolchains
      # we never use (~25 GB) before buildx starts writing layers.
      - name: Free disk space on the runner
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/local/share/powershell /usr/lib/jvm /usr/local/.ghcup
          sudo docker image prune --all --force
          df -h / | tail -1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context }}
          # push if has been able to login or not a pull request
          push: ${{ steps.login.outcome == 'success' && github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
