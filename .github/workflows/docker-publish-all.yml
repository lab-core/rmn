name: Publish All Docker images

# Publishing is manual (Actions tab -> "Run workflow") plus automatic on a
# v* release tag. Nothing builds on ordinary pushes or pull requests: every PR
# used to build all four images (multi-arch, QEMU) as a check, which was most
# of the Actions minutes spent on this repo.
#
# To check that the images build without publishing anything, either
#   - run the workflow manually on the branch with "Push images" unchecked, or
#   - put the `build-images` label on the pull request: the images whose
#     context the PR touches are built once, in check-only mode (no login, no
#     push), and the result shows up as a PR check. Remove and re-add the
#     label to build again after new commits.
on:
  workflow_dispatch:
    inputs:
      push:
        description: Push images to Docker Hub (uncheck to only build)
        type: boolean
        default: true
  push:
    tags: [ 'v*' ]
  pull_request:
    types: [ labeled ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  push_executor_to_dockerhub:
    if: github.event_name != 'pull_request' || github.event.label.name == 'build-images'
    uses: ./.github/workflows/docker-publish.yml
    with:
      image: rmni/executor
      context: ./services/executor
      push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push) }}
    secrets: inherit

  push_server_to_dockerhub:
    if: github.event_name != 'pull_request' || github.event.label.name == 'build-images'
    uses: ./.github/workflows/docker-publish.yml
    with:
      image: rmni/server
      context: ./services/server
      push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push) }}
    secrets: inherit

  push_webapp_to_dockerhub:
    if: github.event_name != 'pull_request' || github.event.label.name == 'build-images'
    uses: ./.github/workflows/docker-publish.yml
    with:
      image: rmni/webapp
      context: ./services/webapp
      push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push) }}
    secrets: inherit

  push_socketio_to_dockerhub:
    if: github.event_name != 'pull_request' || github.event.label.name == 'build-images'
    uses: ./.github/workflows/docker-publish.yml
    with:
      image: rmni/socketio
      context: ./services/socketIO
      push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push) }}
    secrets: inherit
