name: Publish All Docker images

# Publishing is manual (Actions tab -> "Run workflow") plus automatic on a
# v* release tag. Nothing else builds an image: pushes to main and pull
# requests used to build all four images (multi-arch, QEMU) as a check, which
# was most of the Actions minutes spent on this repo, so that trigger is gone.
#
# To check that every image builds on a branch without publishing anything,
# run the workflow manually on that branch with "Push images" unchecked.
on:
  workflow_dispatch:
    inputs:
      push:
        description: Push images to Docker Hub (uncheck to only build)
        type: boolean
        default: true
  push:
    tags: [ 'v*' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  push_executor_to_dockerhub:
    uses: ./.github/workflows/docker-publish.yml
    with:
      image: rmni/executor
      context: ./services/executor
      push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
    secrets: inherit

  push_server_to_dockerhub:
    uses: ./.github/workflows/docker-publish.yml
    with:
      image: rmni/server
      context: ./services/server
      push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
    secrets: inherit

  push_webapp_to_dockerhub:
    uses: ./.github/workflows/docker-publish.yml
    with:
      image: rmni/webapp
      context: ./services/webapp
      push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
    secrets: inherit

  push_socketio_to_dockerhub:
    uses: ./.github/workflows/docker-publish.yml
    with:
      image: rmni/socketio
      context: ./services/socketIO
      push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
    secrets: inherit
