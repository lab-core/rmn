name: nginx config

# Both nginx configurations are checked with `nginx -t` in the images they
# ship in. Runs only when one of them (or this file) changes.
on:
  push:
    branches: [ main ]
    paths:
      - "services/nginx/**"
      - "services/webapp/default.conf"
      - ".github/workflows/test-nginx.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "services/nginx/**"
      - "services/webapp/default.conf"
      - ".github/workflows/test-nginx.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  nginx-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Front nginx (reverse proxy, login rate limit, security headers)
        run: |
          docker build -q -t rmn-nginx-check services/nginx
          # nginx -t resolves the upstream names; any address will do
          docker run --rm \
            --add-host server:127.0.0.1 --add-host socketio:127.0.0.1 --add-host webapp:127.0.0.1 \
            rmn-nginx-check nginx -t

      - name: Webapp nginx (static files, safe security headers)
        run: |
          docker run --rm \
            -v "$PWD/services/webapp/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginxinc/nginx-unprivileged:stable-alpine nginx -t
