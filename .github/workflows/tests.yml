name: Tests

# One workflow for every test suite, with a change-detection job in front.
#
# The branch protection of `main` requires the checks server-tests,
# executor-tests, socketio-tests and webapp-tests. A check produced by a
# path-filtered workflow is reported as "expected" forever on a PR that does
# not touch its paths, which blocks the merge. Here `changes` always runs
# (about one runner minute) and each suite is skipped when its service did not
# change: a skipped job satisfies a required check. Nothing here builds a
# Docker image.
on:
  push:
    branches: [ main ]
  pull_request:
    # feature bases too, so that a stacked pull request is tested against the
    # branch it actually merges into rather than only once it reaches main
    branches: [ main, 'feat/**' ]

# A new push to the same PR cancels the run of the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# the workflow token only reads: the repository, and the pull request's file
# list for the paths filter
permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      common: ${{ steps.filter.outputs.common }}
      server: ${{ steps.filter.outputs.server }}
      executor: ${{ steps.filter.outputs.executor }}
      socketio: ${{ steps.filter.outputs.socketio }}
      webapp: ${{ steps.filter.outputs.webapp }}
      nginx: ${{ steps.filter.outputs.nginx }}
      deployment: ${{ steps.filter.outputs.deployment }}
    steps:
      # push events diff against the commit before the push, which needs history
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            workflow: &workflow
              - '.github/workflows/tests.yml'
            common:
              - *workflow
              - 'services/common/**'
            # the server and executor import the shared package
            server:
              - *workflow
              - 'services/common/**'
              - 'services/server/**'
            executor:
              - *workflow
              - 'services/common/**'
              - 'services/executor/**'
            socketio:
              - *workflow
              - 'services/socketIO/**'
            webapp:
              - *workflow
              - 'services/webapp/**'
            nginx:
              - *workflow
              - 'services/nginx/**'
              - 'services/webapp/default.conf'
              - 'services/webapp/security_headers.inc'
              - 'nginx.conf'
              - 'security_headers'
            deployment:
              - *workflow
              - 'deployment/**'
              - 'scripts/**'
              - 'minikube-helper.sh'

  common-tests:
    needs: changes
    if: needs.changes.outputs.common == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: services/common
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install the package and pytest
        run: |
          python -m pip install --upgrade pip
          # rmn_common.auto_grade uses pymongo (the server's and executor's pin)
          pip install -e . pytest pytest-cov==7.1.0 pymongo==4.18.0
      # .coveragerc holds what is measured and the minimum (fail_under): the
      # run fails when coverage drops below it
      - name: Run tests
        run: python -m pytest -q --cov --cov-report=term-missing:skip-covered
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### common coverage"
            python -m coverage report --format=markdown --skip-covered --fail-under=0
          } >> "$GITHUB_STEP_SUMMARY"

  server-tests:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # the version of the server image (rmn-common requires >= 3.13)
          python-version: '3.14'
          cache: pip
          cache-dependency-path: services/server/requirements-dev.txt
      - name: Install poppler (pdf tooling used by the server)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      # .coveragerc holds what is measured and the minimum (fail_under): the
      # run fails when coverage drops below it
      - name: Run tests
        run: python -m pytest -q --cov --cov-report=term-missing:skip-covered
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### server coverage"
            python -m coverage report --format=markdown --skip-covered --fail-under=0
          } >> "$GITHUB_STEP_SUMMARY"

  executor-tests:
    needs: changes
    if: needs.changes.outputs.executor == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/executor
    steps:
      - uses: actions/checkout@v7
      # same Python as the image (tensorflow has no wheels beyond 3.13)
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/executor/requirements-dev.txt
      # opencv-python (not the headless build) links against libGL; TeX Live and
      # poppler as in the image, or the tests that compile the stats and
      # rasterise real copies are skipped or fail (a ../Q1.png the image's
      # pdflatex refuses reached production that way)
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 \
            texlive-latex-base texlive-latex-recommended poppler-utils
      # The tested modules import the whole stack (opencv, pandas, pypdf,
      # matplotlib, ...) at module level, so the image requirements are
      # installed as they are; the pip cache keeps it to about a minute.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      # .coveragerc holds what is measured and the minimum (fail_under): the
      # run fails when coverage drops below it
      - name: Run tests
        run: python -m pytest -q --cov --cov-report=term-missing:skip-covered
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### executor coverage"
            python -m coverage report --format=markdown --skip-covered --fail-under=0
          } >> "$GITHUB_STEP_SUMMARY"

  socketio-tests:
    needs: changes
    if: needs.changes.outputs.socketio == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/socketIO
    steps:
      - uses: actions/checkout@v7
      # same Python as the image
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: services/socketIO/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      # .coveragerc holds what is measured and the minimum (fail_under): the
      # run fails when coverage drops below it
      - name: Run tests
        run: python -m pytest -q --cov --cov-report=term-missing:skip-covered
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### socketIO coverage"
            python -m coverage report --format=markdown --skip-covered --fail-under=0
          } >> "$GITHUB_STEP_SUMMARY"

  webapp-tests:
    needs: changes
    if: needs.changes.outputs.webapp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/webapp/ng
    steps:
      - uses: actions/checkout@v7
      # same Node as the image
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: services/webapp/ng/package-lock.json
      # .npmrc (legacy-peer-deps) applies, exactly like the image build
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Generated enums match services/common
        # src/app/generated/rmn-contracts.ts is rendered from rmn_common.status
        run: PYTHONPATH=../../common python3 -m rmn_common.typescript --check
      # Karma + Jasmine in the runner's preinstalled Chrome (CHROME_BIN is set
      # by the runner image); ChromeHeadlessCI adds --no-sandbox, see karma.conf.js
      - name: No inline event handlers in the templates
        # the nonce CSP (services/nginx/security_headers) blocks onclick="..."
        # attributes; Angular (click) bindings are the CSP-safe form
        run: |
          if grep -rEn ' on[a-z]+="' src --include=*.html; then
            echo "inline event handler attribute: use an Angular (event) binding"; exit 1
          fi
      # karma.conf.js holds the minimum (coverageReporter.check): the run fails
      # when coverage drops below it
      - name: Run unit tests
        run: npx ng test --watch=false --browsers=ChromeHeadlessCI --code-coverage
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: node scripts/coverage-summary.js coverage/rmn/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"

  nginx-config:
    needs: changes
    if: needs.changes.outputs.nginx == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Front nginx (reverse proxy, login rate limit, security headers)
        run: |
          docker build -q -t rmn-nginx-check services/nginx
          # nginx -t resolves the upstream names; any address will do
          docker run --rm \
            --add-host server:127.0.0.1 --add-host socketio:127.0.0.1 --add-host webapp:127.0.0.1 \
            rmn-nginx-check nginx -t
      - name: Webapp nginx (static files, safe security headers)
        run: |
          docker run --rm \
            -v "$PWD/services/webapp/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/services/webapp/security_headers.inc:/etc/nginx/conf.d/security_headers.inc:ro" \
            nginxinc/nginx-unprivileged:stable-alpine nginx -t
      - name: Host nginx template (nginx.conf at the repo root)
        run: |
          # the template carries placeholder certificate paths; swap in a
          # throwaway self-signed pair so nginx -t can load the server block.
          # `include ../security_headers` resolves against the /etc/nginx prefix.
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=rmn.test \
            -keyout /tmp/privkey.pem -out /tmp/fullchain.pem 2>/dev/null
          sed -e 's#"/.../fullchain.pem"#/etc/ssl/rmn/fullchain.pem#' \
              -e 's#"/.../privkey.pem"#/etc/ssl/rmn/privkey.pem#' nginx.conf > /tmp/host-nginx.conf
          docker run --rm \
            -v /tmp/host-nginx.conf:/etc/nginx/conf.d/default.conf:ro \
            -v "$PWD/security_headers:/etc/security_headers:ro" \
            -v "$PWD/services/nginx/proxy_params:/etc/nginx/proxy_params:ro" \
            -v /tmp/fullchain.pem:/etc/ssl/rmn/fullchain.pem:ro \
            -v /tmp/privkey.pem:/etc/ssl/rmn/privkey.pem:ro \
            nginx:stable-alpine nginx -t

  deployment-config:
    # the manifests render and the operator scripts parse: none of this was
    # validated before it reached the cluster
    needs: changes
    if: needs.changes.outputs.deployment == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Render the kustomization
        run: kubectl kustomize deployment/ > /dev/null
      - name: Shell scripts parse and pass shellcheck (errors only)
        run: |
          for f in scripts/*.sh minikube-helper.sh deployment/k8s-health.sh; do
            bash -n "$f"
          done
          shellcheck -S error scripts/*.sh minikube-helper.sh deployment/k8s-health.sh
