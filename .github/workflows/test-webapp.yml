name: Webapp tests

# Runs only when the webapp (or this file) changes.
on:
  push:
    branches: [ main ]
    paths:
      - "services/webapp/**"
      - ".github/workflows/test-webapp.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "services/webapp/**"
      - ".github/workflows/test-webapp.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  webapp-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/webapp/ng
    steps:
      - uses: actions/checkout@v7

      # same Node as the image
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: services/webapp/ng/package-lock.json

      # .npmrc (legacy-peer-deps) applies, exactly like the image build
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Karma + Jasmine in the runner's preinstalled Chrome (CHROME_BIN is set
      # by the runner image); ChromeHeadlessCI adds --no-sandbox, see karma.conf.js
      - name: Run unit tests
        run: npx ng test --watch=false --browsers=ChromeHeadlessCI
