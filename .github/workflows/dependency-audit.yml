# Known-vulnerability check for every dependency manifest.
#
# Blocking: the baseline is clean since the Dependabot consolidation (#94) and
# the follow-up that moved PyPDF2 to pypdf, so any new advisory fails the
# check. The report still lands in the job summary. To accept a finding that
# cannot be fixed yet, add `--ignore-vuln <ID>` (pip-audit) with a comment
# rather than turning the step back into a warning.
name: dependency-audit

on:
  pull_request:
    paths:
      - "services/*/requirements*.txt"
      - "services/webapp/ng/package*.json"
      - ".github/workflows/dependency-audit.yml"
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"  # Mondays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [server, executor, socketIO]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      # --no-deps/--disable-pip: audit the pinned versions as written, without
      # resolving or building anything (tensorflow, numpy, ...)
      - name: pip-audit services/${{ matrix.service }}
        run: |
          pip-audit --progress-spinner off --no-deps --disable-pip \
            -r services/${{ matrix.service }}/requirements.txt \
            --format markdown --output audit.md || status=$?
          if [ -f audit.md ]; then
            cat audit.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "pip-audit produced no report (tool error, exit ${status:-0})" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "${status:-}" ]; then
            echo "::error::pip-audit found known vulnerabilities in services/${{ matrix.service }} (see the job summary)"
            exit "$status"
          fi

  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/webapp/ng
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: npm audit (production dependencies)
        run: |
          set -o pipefail
          npm audit --omit=dev --audit-level=high | tee audit.txt || status=$?
          { echo '```'; cat audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${status:-}" ]; then
            echo "::error::npm audit found known vulnerabilities in the webapp (see the job summary)"
            exit "$status"
          fi
