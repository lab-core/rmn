name: Server tests

# Only the server has a test suite, so only changes under services/server (or
# to this file) run it; a PR touching the webapp or the manifests does not
# spend a runner on it.
on:
  push:
    branches: [ main ]
    paths:
      - "services/server/**"
      - ".github/workflows/tests.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "services/server/**"
      - ".github/workflows/tests.yml"

# A new push to the same PR cancels the run of the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  server-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/server/requirements-dev.txt

      - name: Install poppler (pdf tooling used by the server)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q
