name: SocketIO tests

# Runs only when the socketIO relay (or this file) changes.
on:
  push:
    branches: [ main ]
    paths:
      - "services/socketIO/**"
      - ".github/workflows/test-socketio.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "services/socketIO/**"
      - ".github/workflows/test-socketio.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  socketio-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/socketIO
    steps:
      - uses: actions/checkout@v7

      # same Python as the image
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: services/socketIO/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q
