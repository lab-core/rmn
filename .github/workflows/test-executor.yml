name: Executor tests

# Runs only when the executor (or this file) changes.
on:
  push:
    branches: [ main ]
    paths:
      - "services/executor/**"
      - ".github/workflows/test-executor.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "services/executor/**"
      - ".github/workflows/test-executor.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  executor-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/executor
    steps:
      - uses: actions/checkout@v7

      # same Python as the image (tensorflow has no wheels beyond 3.13)
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/executor/requirements-dev.txt

      # opencv-python (not the headless build) links against libGL
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      # The tested modules import the whole stack (opencv, pandas, pypdf,
      # matplotlib, ...) at module level, so the image requirements are
      # installed as they are; the pip cache keeps it to about a minute.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q
