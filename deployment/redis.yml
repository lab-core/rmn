---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  ports:
      - port: 6379
        targetPort: redis-server
  selector:
    app: redis
---
apiVersion: v1
kind: ReplicationController
metadata:
  labels:
    app: redis
  name: redis
spec:
  replicas: 1
  selector:
    app: redis
  template:
    metadata:
        labels:
            app: redis
    spec:
        containers:
            # pinned minor: Dependabot cannot bump k8s manifests, so review
            # this tag with the docker-compose one when it moves
            - image: redis:8.2-alpine
              name: redis
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {memory: 512Mi}
              # require a password from every client (sourced from the Secret).
              # Written to a config file at start: as an argument, kubernetes
              # expanded $(REDIS_PASSWORD) into the pod spec, readable by
              # anyone allowed to get pods, and it showed in ps
              command: ["sh", "-c", "printf 'requirepass %s\\n' \"$REDIS_PASSWORD\" > /tmp/redis.conf && exec redis-server /tmp/redis.conf"]
              env:
                - name: REDIS_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: rmn-secrets
                      key: redis-password
              ports:
                - name: redis-server
                  containerPort: 6379
              # tcp probes: redis-cli ping would need the password on the argv
              readinessProbe:
                tcpSocket: {port: 6379}
                periodSeconds: 10
              livenessProbe:
                tcpSocket: {port: 6379}
                initialDelaySeconds: 15
                periodSeconds: 20
        restartPolicy: Always
