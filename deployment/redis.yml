---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  ports:
      - port: 6379
        targetPort: redis-server
  selector:
    app: redis
---
apiVersion: v1
kind: ReplicationController
metadata:
  labels:
    app: redis
  name: redis
spec:
  replicas: 1
  selector:
    app: redis
  template:
    metadata:
        labels:
            app: redis
    spec:
        containers:
            - image: redis:alpine
              name: redis
              # require a password from every client (sourced from the Secret)
              command: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)"]
              env:
                - name: REDIS_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: rmn-secrets
                      key: redis-password
              ports:
                - name: redis-server
                  containerPort: 6379
        restartPolicy: Always
