---
apiVersion: v1
kind: Service
metadata:
  name: webapp
spec:
  ports:
    - name: 80-tcp
      port: 80
      protocol: TCP
      # the unprivileged nginx image listens on 8080
      targetPort: 8080
  selector:
    com.docker.project: webapp
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    com.docker.project: webapp
  name: webapp
spec:
  replicas: 1
  selector:
    matchLabels:
        com.docker.project: webapp
  template:
    metadata:
        labels:
            com.docker.project: webapp
    spec:
        containers:
            - image: rmni/webapp:main
              name: webapp
              imagePullPolicy: Always
              ports:
                - containerPort: 8080
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities: {drop: [ALL]}
              volumeMounts:
                # nginx-unprivileged keeps its pid file and cache under /tmp
                - name: tmp
                  mountPath: /tmp
        volumes:
          - name: tmp
            emptyDir: {}
        restartPolicy: Always
