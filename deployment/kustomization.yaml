# Kustomize entry point for the whole RMN stack.
#
# Deploy everything with:
#   kubectl apply -k deployment/
# or, to target another host (e.g. a staging cluster / minikube):
#   scripts/deploy.sh rmn.example.org
#
# secrets.example.yml is deliberately NOT listed: `kubectl apply -f .` would
# otherwise install the placeholder credentials. Create the real `rmn-secrets`
# Secret first (see README "Secrets"), or copy secrets.example.yml to
# secrets.yml (gitignored) and add it to `resources` locally.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: default

resources:
  # storage
  - nfs.yml
  # data stores
  - mongo.yml
  - redis.yml
  # application services
  - server.yml
  - socketio.yml
  - webapp.yml
  # KEDA-scaled job runner (needs KEDA installed, see README)
  - executor.yml
  # routing
  - ingress.yml
  # maintenance
  - daily-rollout.yml
  # cluster sentinel (k8s-health.sh every 15 min, Slack alerts)
  - health-sentinel.yml

# Cluster-specific values are defined ONCE here: the public hostname (injected
# into every Ingress rule, read by socketIO for CORS and by the sentinel for
# its HTTP probes), the Slack channel and the node CIDR (NFS NetworkPolicy).
# Override the host without editing this file via scripts/deploy.sh <host>.
generatorOptions:
  # keep a stable name so the Deployments' configMapKeyRef can reference it
  disableNameSuffixHash: true
configMapGenerator:
  - name: rmn-config
    literals:
      - host=rmn.mgi.polymtl.ca
      # Slack channel the health sentinel posts to (same channel as the
      # server's dead-man's-switch in services/server/service/health_check.py)
      - slack-channel=C094Y8KQ4HL
      # Node network of the cluster: the ONLY source allowed to reach the NFS
      # server (the kubelet mounts NFS from the node, see nfs.yml). MUST match
      # your cluster; 192.168.49.0/24 is minikube's docker-driver network
      # (`kubectl get nodes -o wide` shows the node IPs).
      - node-cidr=192.168.49.0/24
  # the sentinel script, mounted into the health-sentinel CronJob
  - name: k8s-health-script
    files:
      - k8s-health.sh

replacements:
  - path: replacements.yaml
