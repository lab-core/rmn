# Kustomize entry point for the whole RMN stack.
#
# Deploy everything with:
#   kubectl apply -k deployment/
# or, to target another host (e.g. a staging cluster / minikube):
#   scripts/deploy.sh rmn.example.org
#
# secrets.example.yml is deliberately NOT listed: `kubectl apply -f .` would
# otherwise install the placeholder credentials. Create the real `rmn-secrets`
# Secret first (see README "Secrets"), or copy secrets.example.yml to
# secrets.yml (gitignored) and add it to `resources` locally.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: default

resources:
  # data stores
  - mongo.yml
  - redis.yml
  # application services
  - server.yml
  - socketio.yml
  - webapp.yml
  # KEDA-scaled job runner (needs KEDA installed, see README)
  - executor.yml
  # KEDA-scaled trainer of the digit model, started from the admin page
  - trainer.yml
  # routing
  - ingress.yml
  # requeues the jobs whose executor died (every 10 min)
  - idle-sweep.yml
  # cluster sentinel (k8s-health.sh every 15 min, Slack alerts)
  - health-sentinel.yml
  # monthly storage report (orphans + disk usage by age, Slack; never deletes)
  - storage-report.yml

# Storage: server and executors mount the node directory /data/nfs directly
# (hostPath, single-node clusters). For a multi-node cluster, enable the NFS
# component, which serves that directory over NFS instead (README "Storage"),
# either here or per deploy with `scripts/deploy.sh --storage nfs`:
# components:
#   - components/nfs

# Cluster-specific values are defined ONCE here: the public hostname (injected
# into every Ingress rule, read by socketIO for CORS and by the sentinel for
# its HTTP probes) and the Slack channel. The nfs component adds its own.
# Override the host without editing this file via scripts/deploy.sh <host>.
generatorOptions:
  # keep a stable name so the Deployments' configMapKeyRef can reference it
  disableNameSuffixHash: true
configMapGenerator:
  - name: rmn-config
    literals:
      - host=rmn.mgi.polymtl.ca
      # Slack channel the health sentinel posts to (same channel as the
      # server's dead-man's-switch in services/server/service/health_check.py)
      - slack-channel=C094Y8KQ4HL
      # TZ of the server and executor containers: log timestamps and the
      # Slack dead-man's-switch alert are written in this zone (an IANA name)
      - timezone=America/Montreal
  # the sentinel script, mounted into the health-sentinel CronJob
  - name: k8s-health-script
    files:
      - k8s-health.sh
  # the storage report script, mounted into the storage-report CronJob
  - name: storage-report-script
    files:
      - storage-report.sh

replacements:
  - path: replacements.yaml
