---
apiVersion: v1
kind: Service
metadata:
  name: socketio
spec:
  ports:
    - name: 7000-tcp
      port: 7000
      protocol: TCP
      targetPort: 7000
  selector:
    com.docker.project: socketio
  # ClusterIP: only reached through the Ingress. As NodePort these were open
  # on every node's external interface, bypassing the ingress rate limit/TLS.
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    com.docker.project: socketio
  name: socketio
spec:
  replicas: 1
  selector:
    matchLabels:
        com.docker.project: socketio
  template:
    metadata:
        labels:
            com.docker.project: socketio
    spec:
        containers:
            - image: rmni/socketio:main
              # :main is a moving tag: without Always a rollout restart reuses
              # the cached image and a republished fix never reaches the cluster
              imagePullPolicy: Always
              name: socketio
              ports:
                - containerPort: 7000
                  protocol: TCP
              # the engine.io handshake answers 200 on the polling transport
              readinessProbe:
                httpGet: {path: "/socket.io/?EIO=4&transport=polling", port: 7000}
                periodSeconds: 10
              livenessProbe:
                httpGet: {path: "/socket.io/?EIO=4&transport=polling", port: 7000}
                initialDelaySeconds: 15
                periodSeconds: 20
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {memory: 256Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                capabilities: {drop: [ALL]}
              env:
                # only the webapp origin may open a socket from a browser.
                # A bare hostname allows both https:// and http://; the value
                # comes from the rmn-config ConfigMap (see kustomization.yaml)
                - name: SOCKETIO_CORS_ORIGINS
                  valueFrom:
                    configMapKeyRef:
                      name: rmn-config
                      key: host
                # validate user tokens and authorize room joins against Mongo
                - name: MONGODB_USER
                  valueFrom:
                    secretKeyRef:
                      name: rmn-secrets
                      key: mongodb-user
                - name: MONGODB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: rmn-secrets
                      key: mongodb-password
                # trusted-backend secret: only holders may push notifications
                - name: SOCKETIO_SERVICE_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: rmn-secrets
                      key: socketio-service-token
        restartPolicy: Always
status: {}
