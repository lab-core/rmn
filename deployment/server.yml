---
apiVersion: v1
kind: Service
metadata:
  name: server
spec:
  ports:
    - name: 5000-tcp
      port: 5000
      protocol: TCP
      targetPort: 5000
  selector:
    com.docker.project: server
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    com.docker.project: server
  name: server
spec:
  replicas: 1
  selector:
    matchLabels:
        com.docker.project: server
  template:
    metadata:
        labels:
            com.docker.project: server
    spec:
      volumes:
        - name: nfs-storage
          nfs:
            server: 10.105.99.184  # ip of the nfs service
            path: /
            readOnly: false
      containers:
        - image: rmni/server:main
          name: server
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
              protocol: TCP
          resources: {}
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - mountPath: /mnt/storage
              name: nfs-storage
          env:
            - name: STORAGE
              value: /mnt/storage
            - name: MONGODB_USER
              value: adminuser
            - name: MONGODB_PASSWORD
              value: example
            # Shared secret guarding the /admin/* operator endpoints. Create with:
            #   kubectl create secret generic admin-api-key --from-literal=key=$(openssl rand -hex 32)
            # optional:true => if the secret is absent the key is unset and the
            # admin endpoints are disabled (fail closed) rather than blocking startup.
            - name: ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: admin-api-key
                  key: key
                  optional: true
          terminationMessagePolicy: FallbackToLogsOnError
      restartPolicy: Always
