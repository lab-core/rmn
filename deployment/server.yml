---
apiVersion: v1
kind: Service
metadata:
  name: server
spec:
  ports:
    - name: 5000-tcp
      port: 5000
      protocol: TCP
      targetPort: 5000
  selector:
    com.docker.project: server
  # ClusterIP: only reached through the Ingress. As NodePort these were open
  # on every node's external interface, bypassing the ingress rate limit/TLS.
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    com.docker.project: server
  name: server
spec:
  replicas: 1
  selector:
    matchLabels:
        com.docker.project: server
  template:
    metadata:
        labels:
            com.docker.project: server
    spec:
      volumes:
        - name: nfs-storage
          nfs:
            # placeholder: kustomize replaces it with rmn-config.data.nfs-ip
            server: NFS_IP
            path: /
            readOnly: false
      containers:
        - image: rmni/server:main
          name: server
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
              protocol: TCP
          # gunicorn -w 2 + pandas/PDF handling; no CPU limit (throttling only
          # slows requests down), memory limit so a leak cannot take the node.
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 4Gi}
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
          # UID/GID 1000 == the rmn user baked into the image; the NFS share
          # must be owned by it (README "Non-root containers"). No read-only
          # root filesystem: the server writes its temp folders under /Server.
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities: {drop: [ALL]}
          volumeMounts:
            - mountPath: /mnt/storage
              name: nfs-storage
          env:
            - name: STORAGE
              value: /mnt/storage
            # only the webapp origin may call the API from a browser (a bare
            # hostname allows https:// and http://); absent => every origin
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: rmn-config
                  key: host
            # time zone of the logs and of the Slack alert (rmn-config)
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: rmn-config
                  key: timezone
                  optional: true
            # all credentials come from the rmn-secrets Secret (see
            # deployment/secrets.example.yml)
            - name: MONGODB_USER
              valueFrom:
                secretKeyRef:
                  name: rmn-secrets
                  key: mongodb-user
            - name: MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rmn-secrets
                  key: mongodb-password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rmn-secrets
                  key: redis-password
            - name: SLACK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rmn-secrets
                  key: slack-token
            # channel of the dead-man's switch alert, shared with the sentinel
            - name: SLACK_CHANNEL
              valueFrom:
                configMapKeyRef:
                  name: rmn-config
                  key: slack-channel
                  optional: true
            # empty/absent => the /admin/* endpoints are disabled (fail closed)
            - name: ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rmn-secrets
                  key: admin-api-key
                  optional: true
            - name: SOCKETIO_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rmn-secrets
                  key: socketio-service-token
          terminationMessagePolicy: FallbackToLogsOnError
      restartPolicy: Always
