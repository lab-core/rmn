---
apiVersion: v1
kind: Service
metadata:
  name: server
spec:
  ports:
    - name: 5000-tcp
      port: 5000
      protocol: TCP
      targetPort: 5000
  selector:
    com.docker.project: server
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    com.docker.project: server
  name: server
spec:
  replicas: 1
  selector:
    matchLabels:
        com.docker.project: server
  template:
    metadata:
        labels:
            com.docker.project: server
    spec:
      volumes:
        - name: nfs-storage
          nfs:
            # placeholder: kustomize replaces it with rmn-config.data.nfs-ip
            server: NFS_IP
            path: /
            readOnly: false
      containers:
        - image: rmni/server:main
          name: server
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
              protocol: TCP
          resources: {}
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - mountPath: /mnt/storage
              name: nfs-storage
          env:
            - name: STORAGE
              value: /mnt/storage
            # all credentials come from the rmn-secrets Secret (see
            # deployment/secrets.example.yml)
            - name: MONGODB_USER
              valueFrom:
                secretKeyRef:
                  name: rmn-secrets
                  key: mongodb-user
            - name: MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rmn-secrets
                  key: mongodb-password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rmn-secrets
                  key: redis-password
            - name: SLACK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rmn-secrets
                  key: slack-token
                  optional: true
            # empty/absent => the /admin/* endpoints are disabled (fail closed)
            - name: ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rmn-secrets
                  key: admin-api-key
                  optional: true
            - name: SOCKETIO_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rmn-secrets
                  key: socketio-service-token
          terminationMessagePolicy: FallbackToLogsOnError
      restartPolicy: Always
