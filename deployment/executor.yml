# Lets the KEDA redis scaler read the (now password-protected) queue length.
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: redis-trigger-auth
  namespace: default
spec:
  secretTargetRef:
    - parameter: password
      name: rmn-secrets
      key: redis-password
---
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: job-executor
  namespace: default
spec:
  jobTargetRef:
    template:
      spec:
        # the executor never calls the Kubernetes API; without this every job
        # pod carries a service-account token that anything reading files
        # inside the pod (pdflatex \input of a csv value) could return to a user
        automountServiceAccountToken: false
        volumes:
          # same node directory as the server (see server.yml); the nfs
          # component swaps it for an NFS mount
          - name: storage
            hostPath:
              path: /data/nfs
              type: Directory
        containers:
          - name: executor
            image: rmni/executor:main
            imagePullPolicy: Always
            ports:
              - containerPort: 5000
                protocol: TCP
            resources:
              limits:
                memory: 5G
            # UID/GID 1000 == the rmn user baked into the image; the storage
            # must be owned by it (README "Non-root containers"). No read-only
            # root filesystem: the executor writes tmp_<job> under /Executor.
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              capabilities: {drop: [ALL]}
            volumeMounts:
              - mountPath: /mnt/storage
                name: storage
            env:
              - name: STORAGE
                value: /mnt/storage
              # time zone of the logs and of the dates printed in reports
              - name: TZ
                valueFrom:
                  configMapKeyRef:
                    name: rmn-config
                    key: timezone
                    optional: true
              - name: MAX_RETRY
                value: "5"
              # below the 5G memory limit: the guard measures the container
              # (cgroup) and must fire before the OOM-kill does
              - name: MAX_RAM_GB
                value: "4"
              - name: MONGODB_USER
                valueFrom:
                  secretKeyRef:
                    name: rmn-secrets
                    key: mongodb-user
              - name: MONGODB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: rmn-secrets
                    key: mongodb-password
              - name: REDIS_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: rmn-secrets
                    key: redis-password
              - name: SOCKETIO_SERVICE_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: rmn-secrets
                    key: socketio-service-token
            terminationMessagePolicy: FallbackToLogsOnError
        restartPolicy: Never
    activeDeadlineSeconds: 5400
    backoffLimit: 5
  pollingInterval: 1
  # KEDA's default is 100. With requests == limits == 5G a queue of N exams
  # created N pods; the node holds about two, the rest sat Pending for hours
  # and tripped the sentinel. Raise together with the node's memory.
  maxReplicaCount: 2
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  scalingStrategy:
    # "accurate" is for a queue that only shrinks when the work finishes: it
    # counts the jobs that are still pending, so the moment a pod starts
    # running it stops counting, and the item it has not popped yet looks
    # like work for somebody else. One queued job therefore produced two
    # executors, the second finding nothing (job d98c2837: pod A Running at
    # 17:58:48, job B created at 17:58:49, A popped the item at 17:58:49.6).
    # This queue shrinks when a job is taken, not when it ends, so counting
    # what is running is the right thing.
    strategy: "default"
  triggers:
  - type: redis
    metadata:
      address: redis.default:6379
      listName: job_queue
      listLength: '1'
    # authenticate the scaler against the password-protected Redis
    authenticationRef:
      name: redis-trigger-auth
