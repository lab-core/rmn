apiVersion: v1
kind: Secret
metadata:
  name: redis-consumer
data:
  RedisHost: bG9jYWxob3N0
  RedisPort: NjM3OQ==
---
# Lets the KEDA redis scaler read the (now password-protected) queue length.
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: redis-trigger-auth
  namespace: default
spec:
  secretTargetRef:
    - parameter: password
      name: rmn-secrets
      key: redis-password
---
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: job-executor
  namespace: default
spec:
  jobTargetRef:
    template:
      spec:
        volumes:
          - name: nfs-storage
            nfs:
              # placeholder: kustomize replaces it with rmn-config.data.nfs-ip
              server: NFS_IP
              path: /
              readOnly: false
        containers:
          - name: executor
            image: rmni/executor:main
            imagePullPolicy: Always
            ports:
              - containerPort: 5000
                protocol: TCP
            resources:
              limits:
                memory: 5G
            # UID/GID 1000 == the rmn user baked into the image; the NFS share
            # must be owned by it (README "Non-root containers"). No read-only
            # root filesystem: the executor writes tmp_<job> under /Executor.
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              capabilities: {drop: [ALL]}
            volumeMounts:
              - mountPath: /mnt/storage
                name: nfs-storage
            env:
              - name: STORAGE
                value: /mnt/storage
              # time zone of the logs and of the dates printed in reports
              - name: TZ
                valueFrom:
                  configMapKeyRef:
                    name: rmn-config
                    key: timezone
                    optional: true
              - name: MAX_RETRY
                value: "5"
              - name: MAX_RAM_GB
                value: "8"
              - name: MONGODB_USER
                valueFrom:
                  secretKeyRef:
                    name: rmn-secrets
                    key: mongodb-user
              - name: MONGODB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: rmn-secrets
                    key: mongodb-password
              - name: REDIS_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: rmn-secrets
                    key: redis-password
              - name: SOCKETIO_SERVICE_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: rmn-secrets
                    key: socketio-service-token
            terminationMessagePolicy: FallbackToLogsOnError
        restartPolicy: Never
    activeDeadlineSeconds: 5400
    backoffLimit: 5
  pollingInterval: 1
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  scalingStrategy:
    strategy: "accurate"
  triggers:
  - type: redis
    metadata:
      address: redis.default:6379
      listName: job_queue
      listLength: '1'
    # authenticate the scaler against the password-protected Redis
    authenticationRef:
      name: redis-trigger-auth
