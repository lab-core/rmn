apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rmn-ingress
  annotations:
    nginx.ingress.kubernetes.io/enable-rewrite-log: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    nginx.ingress.kubernetes.io/proxy-body-size: 5G
    # a 5 GB task creation is copied to the NFS share after the body arrived;
    # the default 60 s upstream timeout returns a 504 before that finishes.
    # Keep in sync with GUNICORN_CMD_ARGS --timeout in the server image.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "1800"
spec:
  rules:
    # placeholder: kustomize replaces it with rmn-config.data.host (see
    # kustomization.yaml). Apply via `kubectl apply -k`, not `-f`.
    - host: RMN_HOST
      http:
        paths:
          # route any path to the web application
          - path: /(.*)
            pathType: Prefix
            backend:
              service:
                name: webapp
                port:
                  number: 80
          - path: /api/(.*)
            pathType: Prefix
            backend:
              service:
                name: server
                port:
                  number: 5000
          - path: /(socket.io/.*)
            pathType: Prefix
            backend:
              service:
                name: socketio
                port:
                  number: 7000
---
# Separate Ingress so the rate-limit annotations apply only to /api/login
# (they are per-Ingress). This more specific path is matched before the
# general /api/(.*) rule above, throttling login brute-force attempts.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rmn-login-ratelimit
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    # 10 login requests per minute per client IP; burst = rpm * multiplier
    nginx.ingress.kubernetes.io/limit-rpm: "10"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "1"
spec:
  rules:
    # placeholder: kustomize replaces it with rmn-config.data.host (see
    # kustomization.yaml). Apply via `kubectl apply -k`, not `-f`.
    - host: RMN_HOST
      http:
        paths:
          - path: /api/(login)
            pathType: Prefix
            backend:
              service:
                name: server
                port:
                  number: 5000
