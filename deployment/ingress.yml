apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rmn-ingress
  annotations:
    nginx.ingress.kubernetes.io/enable-rewrite-log: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    nginx.ingress.kubernetes.io/proxy-body-size: 5G
spec:
  rules:
    - host: rmn.mgi.polymtl.ca
      http:
        paths:
          # route any path to the web application
          - path: /(.*)
            pathType: Prefix
            backend:
              service:
                name: webapp
                port:
                  number: 80
          - path: /api/(.*)
            pathType: Prefix
            backend:
              service:
                name: server
                port:
                  number: 5000
          - path: /(socket.io/.*)
            pathType: Prefix
            backend:
              service:
                name: socketio
                port:
                  number: 7000
