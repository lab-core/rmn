# Template for the cluster Secret consumed by every service.
#
# Option A — imperative (nothing secret on disk):
#   kubectl create secret generic rmn-secrets \
#     --from-literal=mongodb-user=adminuser \
#     --from-literal=mongodb-password="$(openssl rand -hex 24)" \
#     --from-literal=redis-password="$(openssl rand -hex 24)" \
#     --from-literal=admin-api-key="$(openssl rand -hex 32)" \
#     --from-literal=slack-token="xoxb-..."
#
# Option B — declarative: copy this file to deployment/secrets.yml, fill in the
# values, and `kubectl apply -f deployment/secrets.yml`.
# deployment/secrets.yml is gitignored — NEVER commit real secrets.
#
# NOTE: on an existing Mongo data volume the root password is fixed at first
# init; to change it, rotate inside mongo (db.changeUserPassword) then update
# this Secret. admin-api-key empty => the /admin/* endpoints are disabled
# (fail closed). slack-token empty => the health-check pings are disabled.
apiVersion: v1
kind: Secret
metadata:
  name: rmn-secrets
  namespace: default
type: Opaque
stringData:
  mongodb-user: adminuser
  mongodb-password: CHANGE_ME
  redis-password: CHANGE_ME
  admin-api-key: CHANGE_ME
  slack-token: ""
  socketio-service-token: CHANGE_ME
