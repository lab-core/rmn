---
apiVersion: v1
kind: Service
metadata:
  name: mongo
spec:
  ports:
    - port: 27017
      targetPort: mongo-server
  selector:
    app: mongo
---
apiVersion: v1
kind: ReplicationController
metadata:
  labels:
    app: mongo
  name: mongo
spec:
  replicas: 1
  selector:
    app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rmn-secrets
                  key: mongodb-user
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rmn-secrets
                  key: mongodb-password
          image: mongo:8.2
          name: mongo
          # mongod sizes its WiredTiger cache from the cgroup limit
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 2Gi}
          ports:
            - name: mongo-server
              containerPort: 27017
          volumeMounts:
            - mountPath: /data/db
              name: mongo-vol
      restartPolicy: Always
      volumes:
        - name: mongo-vol
          hostPath:
            path: /data/mongo
            type: Directory
