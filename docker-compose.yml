
services:
  redis:
    image: redis:alpine
    restart: always
    # require a password from every client (secrets come from the gitignored .env)
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
  mongo:
    # featureCompatibilityVersion of the data is 8.0; when :latest jumps to a
    # new major that rejects it, bump FCV first (setFeatureCompatibilityVersion)
    image: mongo:latest
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - ./storage/mongo:/data/db
  executor:
   build: ./services/executor
#   command: bash -c "while true; do echo hello; sleep 2; done"
   restart: always
   # ports:
   #   - "5001:5001"
   environment:
     STORAGE: /Executor/storage
     REDIS_POP: block
     MONGODB_USER: ${MONGODB_USER}
     MONGODB_PASSWORD: ${MONGODB_PASSWORD}
     REDIS_PASSWORD: ${REDIS_PASSWORD}
   volumes:
     - ./storage:/Executor/storage
  server:
    build:
      context: ./services/server
      dockerfile: Dockerfile-dev
    restart: always
    # ports:
    #   - "5000:5000"
    environment:
      FLASK_ENV: development
      MONGODB_USER: ${MONGODB_USER}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SLACK_TOKEN: ${SLACK_TOKEN:-}
      # Shared secret guarding the /admin/* operator endpoints; empty => those
      # endpoints are disabled (fail closed). All secrets come from .env.
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
    volumes:
      - ./storage:/Server/storage
  socketio:
    build: ./services/socketIO
    restart: always
    # no host port: only reached inside the compose network (nginx proxies
    # /socket.io/), and host port 7000 clashes with macOS AirPlay Receiver
    # network_mode: "host"
  webapp:
    # build: ./services/webapp
    # command: bash -c "while true; do echo hello; sleep 2; done"
    build:
      context: ./services/webapp
      dockerfile: Dockerfile-dev
    restart: always
    volumes:
      - ./services/webapp/ng/src:/app/src:rw
    ports:
      - "8080:80"
  nginx:
    # depends_on:
    #   - webapp
    #   - server
    #   - socketio
    build: ./services/nginx
    restart: always
    ports:
      - 80:80
volumes:
  storage:
