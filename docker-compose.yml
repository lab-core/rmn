
services:
  redis:
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"
  mongo:
    image: mongo:latest
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: adminuser
      MONGO_INITDB_ROOT_PASSWORD: example
    ports:
      - "27017:27017"
    volumes:
      - ./storage/mongo:/data/db
  executor:
   build: ./services/executor
#   command: bash -c "while true; do echo hello; sleep 2; done"
   restart: always
   # ports:
   #   - "5001:5001"
   environment:
     STORAGE: /Executor/storage
     REDIS_POP: block
   volumes:
     - ./storage:/Executor/storage
  server:
    build:
      context: ./services/server
      dockerfile: Dockerfile-dev
    restart: always
    # ports:
    #   - "5000:5000"
    environment:
      FLASK_ENV: development
      # Shared secret guarding the /admin/* operator endpoints. Sourced from
      # the host env; when empty those endpoints are disabled (fail closed).
      # Set it before `docker compose up`, e.g. export ADMIN_API_KEY=$(openssl rand -hex 32)
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
    volumes:
      - ./storage:/Server/storage
  socketio:
    build: ./services/socketIO
    restart: always
    ports:
      - '7000:7000'
    # network_mode: "host"
  webapp:
    # build: ./services/webapp
    # command: bash -c "while true; do echo hello; sleep 2; done"
    build:
      context: ./services/webapp
      dockerfile: Dockerfile-dev
    restart: always
    volumes:
      - ./services/webapp/ng/src:/app/src:rw
    ports:
      - "8080:80"
  nginx:
    # depends_on:
    #   - webapp
    #   - server
    #   - socketio
    build: ./services/nginx
    restart: always
    ports:
      - 80:80
volumes:
  storage:
