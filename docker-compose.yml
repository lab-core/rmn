
services:
  redis:
    image: redis:8.10-alpine
    restart: always
    # require a password from every client (secrets come from the gitignored
    # .env). Written to a config file at start: on the command line the
    # password showed in `docker inspect` and `ps`.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-c", "printf 'requirepass %s\\n' \"$$REDIS_PASSWORD\" > /tmp/redis.conf && exec redis-server /tmp/redis.conf"]
    # loopback only: password-protected, but no reason to serve the LAN
    ports:
      - "127.0.0.1:6379:6379"
  mongo:
    # same series as the cluster (deployment/mongo.yml). Not :latest: recent
    # 8.0 and 8.3 releases refuse to start on Linux 6.19 to 7.0.13
    # (SERVER-121912, a TCMalloc/rseq crash) and Docker Desktop's VM runs such
    # a kernel; 8.2 has no gate. featureCompatibilityVersion of the data is 8.0.
    image: mongo:8.2
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - ./storage/mongo:/data/db
  executor:
   build:
     # services/ so the image can copy the shared rmn-common package
     context: ./services
     dockerfile: executor/Dockerfile
     # reuse the dependency layers published by CI (see docker-publish.yml)
     cache_from:
       - type=registry,ref=rmni/executor:buildcache
#   command: bash -c "while true; do echo hello; sleep 2; done"
   restart: always
   # ports:
   #   - "5001:5001"
   environment:
     STORAGE: /Executor/storage
     TZ: ${TZ:-America/Montreal}
     REDIS_POP: block
     MONGODB_USER: ${MONGODB_USER}
     MONGODB_PASSWORD: ${MONGODB_PASSWORD}
     REDIS_PASSWORD: ${REDIS_PASSWORD}
     SOCKETIO_SERVICE_TOKEN: ${SOCKETIO_SERVICE_TOKEN:-}
   volumes:
     - ./storage:/Executor/storage
  server:
    build:
      context: ./services
      dockerfile: server/Dockerfile-dev
      cache_from:
        - type=registry,ref=rmni/server:buildcache
    restart: always
    # ports:
    #   - "5000:5000"
    environment:
      FLASK_ENV: development
      TZ: ${TZ:-America/Montreal}
      MONGODB_USER: ${MONGODB_USER}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SLACK_TOKEN: ${SLACK_TOKEN:-}
      SOCKETIO_SERVICE_TOKEN: ${SOCKETIO_SERVICE_TOKEN:-}
      # Shared secret guarding the /admin/* operator endpoints; empty => those
      # endpoints are disabled (fail closed). All secrets come from .env.
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
    volumes:
      - ./storage:/Server/storage
  socketio:
    build:
      context: ./services/socketIO
      cache_from:
        - type=registry,ref=rmni/socketio:buildcache
    restart: always
    # no host port: only reached inside the compose network (nginx proxies
    # /socket.io/), and host port 7000 clashes with macOS AirPlay Receiver
    # network_mode: "host"
    environment:
      MONGODB_USER: ${MONGODB_USER}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD}
      SOCKETIO_SERVICE_TOKEN: ${SOCKETIO_SERVICE_TOKEN:-}
  webapp:
    # build: ./services/webapp
    # command: bash -c "while true; do echo hello; sleep 2; done"
    build:
      context: ./services
      dockerfile: webapp/Dockerfile-dev
      # the npm install layer is shared with the published image
      cache_from:
        - type=registry,ref=rmni/webapp:buildcache
    restart: always
    volumes:
      - ./services/webapp/ng/src:/app/src:rw
    ports:
      - "8080:80"
  nginx:
    # depends_on:
    #   - webapp
    #   - server
    #   - socketio
    build: ./services/nginx
    restart: always
    ports:
      - 80:80
volumes:
  storage:
