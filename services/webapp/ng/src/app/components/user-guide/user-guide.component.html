<div class="user-guide-container">
  <app-main-menu></app-main-menu>
  <div class="guide-panel">
    <nav class="guide-toc">
      <h2>Guide d'utilisation</h2>
      <ul>
        @for (chapter of chapters; track chapter.file) {
          <li>
            <a [routerLink]="['/user-guide', chapter.file]" [class.active]="chapter === current">{{ chapter.title }}</a>
          </li>
        }
      </ul>
    </nav>
    <!-- the click handler keeps the links between chapters in the app -->
    <article #content class="guide-content" (click)="onContentClick($event)">
      @if (error) {
        <p class="guide-error">{{ error }}</p>
      }
      <div [innerHTML]="html"></div>
    </article>
  </div>
</div>
