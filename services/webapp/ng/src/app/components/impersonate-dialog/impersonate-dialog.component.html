<h2 mat-dialog-title><mat-icon>switch_account</mat-icon> Prendre le rôle d'un utilisateur</h2>
<mat-dialog-content>
    <p>Vous agirez en son nom, avec tous ses droits, jusqu'à revenir à votre compte depuis le menu.</p>
    <mat-form-field appearance="outline">
        <mat-label>Utilisateur</mat-label>
        <mat-select [(value)]="selected">
          @for (user of users; track user.username) {
            <mat-option [value]="user.username">{{user.username}} ({{user.role}})</mat-option>
          }
        </mat-select>
    </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-stroked-button mat-dialog-close>Annuler</button>
    <button class="button" mat-flat-button color="primary" (click)="impersonate()">Prendre le rôle</button>
</mat-dialog-actions>
