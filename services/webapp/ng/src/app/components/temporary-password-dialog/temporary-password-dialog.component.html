<div class="container">
    <h2>Mot de passe temporaire de {{data.username}}</h2>
    <p>Transmettez-le à l'utilisateur : il ne sera plus affiché. Il devra le changer à sa prochaine connexion.</p>
    <code class="password">{{data.password}}</code>
    <div class="buttons">
        <button mat-stroked-button (click)="copy()"><mat-icon>content_copy</mat-icon> Copier</button>
        <button mat-flat-button color="primary" (click)="dialogRef.close()">FERMER</button>
    </div>
</div>
