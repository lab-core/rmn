<h2 mat-dialog-title><mat-icon>key</mat-icon> Mot de passe temporaire</h2>
<mat-dialog-content>
  <p>Nouveau mot de passe de <strong>{{data.username}}</strong> :</p>
  <div class="password-box">
    <code class="password">{{data.password}}</code>
    <button mat-icon-button class="copy" title="Copier" (click)="copy()"><mat-icon>content_copy</mat-icon></button>
  </div>
  <p class="hint">Transmettez-le à l'utilisateur : il ne sera plus affiché. Il devra le changer à sa prochaine connexion.</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-flat-button color="primary" (click)="dialogRef.close()">Fermer</button>
</mat-dialog-actions>
