<div class="dialog-container">
    <div class="header-container">
        <h1>Téléversement des fichiers</h1>
    </div>
    <div class="content-container">
        <div class="error-messages-container">
            <div class="error-message" *ngIf="!isFileNamesEmpty()">
                <div *ngFor="let filename of filenames; let i = index" class="filename-div">
                    <span class="filename-text">{{ filename }}</span>
                    <button mat-icon-button color="primary" (click)="downloadFile(filename)">
                        <mat-icon>download</mat-icon>
                    </button>
<!--                  <span class="file-error">{{ errorMessages[i] }}</span>-->
                </div>
            </div>
            <button mat-raised-button color="primary" (click)="downloadAllAsZip()" class="download-zip-button" [disabled]="isFileNamesEmpty()">Télécharger tous les fichiers en ZIP</button>
        </div>
        <div class="upload-container"
            (drop)="onDrop($event)"
            (dragover)="onDragOver($event)">
            <div class="upload-drop-zone" (click)="onUploadClick()">
                Glissez-déposez les fichiers ici ou cliquez pour téléverser
            </div>
            <input #fileUpload type="file" id="file-upload" (change)="onFileSelected($event)" multiple>

            <div class="selected-files-container" *ngIf="selectedFiles.length > 0">
                <h3>Fichiers sélectionnés:</h3>
                <ul>
                    <li *ngFor="let file of selectedFiles; let i = index">
                        <span>{{ file.name }}</span>
                        <button mat-icon-button color="warn" (click)="deleteFile(i)">
                            <mat-icon>delete</mat-icon>
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </div>
    <div class="uploaded-files-container" *ngIf="uploadedFiles.length > 0">
        <h3>Fichiers téléversés:</h3>
        <ul>
            <li *ngFor="let file of uploadedFiles">{{ file }}</li>
        </ul>
    </div>
    <div class="button-container">
        <button mat-raised-button color="primary" [disabled]="disabled" (click)="retryJob()">Continuer</button>
        <button mat-raised-button color="primary" (click)="ignoreAndContinue()" [disabled]="isFileNamesEmpty()">Ignorer et continuer</button>
        <button mat-raised-button color="warn" (click)="cancel()">Annuler</button>
    </div>
</div>
<div id="overlay" *ngIf="this.downloading"></div>
<mat-spinner *ngIf="this.downloading" color="accent" [diameter]="150" mode="determinate" [value]="this.downloadProgress"></mat-spinner>
<div class="files-uploading-steps" *ngIf="this.downloading">Téléversement du fichier...</div>
