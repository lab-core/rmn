server {
    # 8080: the image runs nginx unprivileged, which cannot bind port 80.
    # The k8s Service still exposes port 80 (targetPort 8080).
    listen       8080;
    listen  [::]:8080;
    server_name  _;
    server_tokens off;

    # Security headers. The front nginx (see /security_headers) adds the full
    # set including a nonce-based CSP; these are the safe subset that must
    # hold even when the webapp is reached without it. `always` keeps them
    # on error pages. add_header is not inherited by a location that sets
    # its own, so none of the locations below may call add_header.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin always;
    # byte-identical to the front proxy's values: both are sent, a difference
    # leaves the browser with two policies
    add_header Permissions-Policy "geolocation=(),midi=(),sync-xhr=(),microphone=(),camera=(),magnetometer=(),gyroscope=(),fullscreen=(self),payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    #access_log  /var/log/nginx/host.access.log  main;

    root   /usr/share/nginx/html;

    # specify the configuration for the '/' location
    location / {
        # try to serve the requested URI. if that fails then try to
        # serve the URI with a trailing slash. if that fails, then
        # serve the index.html file; this is needed in order to serve
        # Angular routes--e.g.,'localhost/login' will serve the index.html file
        try_files $uri /index.html;
        index  index.html index.htm;
    }

    # needed for extended-pdf-viewer (extension mjs)
    location ~* \.mjs$ {
        types { application/javascript mjs; }
    }

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
}
