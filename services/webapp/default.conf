server {
    # 8080: the image runs nginx unprivileged, which cannot bind port 80.
    # The k8s Service still exposes port 80 (targetPort 8080).
    listen       8080;
    listen  [::]:8080;
    server_name  _;
    server_tokens off;

    # Security headers (see security_headers.inc). add_header is not inherited
    # by a location that sets its own, so every location below that adds a
    # Cache-Control header includes the same file again.
    include /etc/nginx/conf.d/security_headers.inc;

    #access_log  /var/log/nginx/host.access.log  main;

    root   /usr/share/nginx/html;

    # specify the configuration for the '/' location
    location / {
        # try to serve the requested URI. if that fails then try to
        # serve the URI with a trailing slash. if that fails, then
        # serve the index.html file; this is needed in order to serve
        # Angular routes--e.g.,'localhost/login' will serve the index.html file
        try_files $uri /index.html;
        index  index.html index.htm;
    }

    # Caching. Without a Cache-Control header browsers cached index.html
    # heuristically (a white screen after a deploy, the old index naming
    # bundles that no longer exist) and revalidated the hashed bundles on
    # every load. index.html is always revalidated (cheap: ETag), a file
    # whose name carries the build hash never changes and is kept a year.
    location = /index.html {
        include /etc/nginx/conf.d/security_headers.inc;
        add_header Cache-Control "no-cache" always;
    }

    location ~* "\.[0-9a-f]{16}\.(js|css|woff2?|ttf|png|jpe?g|svg|gif|ico)$" {
        include /etc/nginx/conf.d/security_headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # needed for extended-pdf-viewer (extension mjs). Its files are versioned
    # by name, not by content hash, and carry a local patch (the CSP nonce),
    # so they are revalidated like index.html rather than kept a year.
    location ~* \.mjs$ {
        types { application/javascript mjs; }
        include /etc/nginx/conf.d/security_headers.inc;
        add_header Cache-Control "no-cache" always;
    }

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
}
