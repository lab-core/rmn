server {
        listen      80;
        listen      [::]:80;
        server_name localhost;

        ### Security headers ###
        include security_headers;

        proxy_redirect      off;
        client_max_body_size 5G;

        # Docker's embedded DNS. With the upstream in a variable, nginx
        # resolves the name at request time (cached valid=) instead of once
        # at startup: a container recreated by compose gets a new IP, which
        # used to leave nginx answering 502 until it was restarted. It also
        # lets nginx start before the upstreams exist.
        # A variable in proxy_pass passes the URI as is (no prefix
        # replacement), hence the rewrites below.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $webapp   http://webapp;
        set $server   http://server:5000;
        set $socketio http://socketio:7000;

        location / {
                proxy_pass $webapp;
                include proxy_params;
        }

        # rate-limited login (burst absorbs a few quick retries, then 503s)
        location = /api/users/login {
                limit_req zone=login burst=5 nodelay;
                rewrite ^ /users/login break;
                proxy_pass $server;
                include proxy_params;
        }

        location /api/ {
                # set $server http://host.docker.internal:5000;
                rewrite ^/api/(.*)$ /$1 break;
                proxy_pass $server;
                include proxy_params;
                # multi-GB uploads: see the ingress proxy-read-timeout
                proxy_read_timeout 1800s;
                proxy_send_timeout 1800s;
        }

        location /socket.io/ {
                proxy_pass $socketio;
                include proxy_params;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
        }

        location /sockjs-node {
                proxy_pass  $webapp$request_uri;
                include proxy_params;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
        }

        location /ng-cli-ws {
                proxy_pass  $webapp$request_uri;
                include proxy_params;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
        }

}
