server {
        listen      80;
        listen      [::]:80;
        server_name localhost;

        ### Security headers ###
        include security_headers;

        proxy_redirect      off;
        client_max_body_size 5G;

        location / {
                proxy_pass http://webapp;
                include proxy_params;
        }

        # rate-limited login (burst absorbs a few quick retries, then 503s)
        location = /api/users/login {
                limit_req zone=login burst=5 nodelay;
                proxy_pass http://server:5000/users/login;
                include proxy_params;
        }

        location /api/ {
                # proxy_pass http://host.docker.internal:5000/;
                proxy_pass http://server:5000/;
                include proxy_params;
                # multi-GB uploads: see the ingress proxy-read-timeout
                proxy_read_timeout 1800s;
                proxy_send_timeout 1800s;
        }

        location /socket.io/ {
                proxy_pass http://socketio:7000/socket.io/;
                include proxy_params;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
        }

        location /sockjs-node {
                proxy_pass  http://webapp$request_uri;
                include proxy_params;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
        }

        location /ng-cli-ws {
                proxy_pass  http://webapp$request_uri;
                include proxy_params;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
        }

}
