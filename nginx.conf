# Template for the host reverse proxy in front of the kubernetes ingress:
# install it under sites-enabled/conf.d (http context), set server_name and
# the certificate paths. Checked with `nginx -t` in CI (tests.yml).

# local kubernetes ip address to proxy the traffic. A map, because `set` is
# only allowed inside server/location blocks.
map $host $kube_host {
        default "192.168.49.2";
}

server {
        listen      443 ssl http2;
        listen      [::]:443 ssl http2;
        server_name my.domain;

        ### Certificates ###
        ssl_certificate "/.../fullchain.pem";
        ssl_certificate_key "/.../privkey.pem";
        ssl_session_cache shared:SSL:1m;
        ssl_session_timeout  10m;

        ### Security headers ###
        include ../security_headers;

        proxy_redirect      off;
        client_max_body_size 5G;

        location / {
                proxy_pass http://$kube_host;
                include proxy_params;
                # multi-GB task creation: the body is copied to the NFS share
                # after it arrived, longer than the 60 s default. Keep in sync
                # with the proxy-*-timeout annotations in deployment/ingress.yml
                proxy_read_timeout 1800s;
                proxy_send_timeout 1800s;
        }


        location /api/admin/ {
                deny all;
        }

        location /socket.io/ {
                proxy_pass http://$kube_host/socket.io/;
                include proxy_params;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
        }
}

server {
        listen      80;
        listen      [::]:80;
        server_name my.domain;
	return 301 https://$host$request_uri;
}

server {
        listen      80;
        listen      [::]:80;
        server_name localhost;

        location / {
                allow 127.0.0.1;
                deny all;
                proxy_pass http://$kube_host;
                proxy_set_header    Host "my.domain";
        }
}
